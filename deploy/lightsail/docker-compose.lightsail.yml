services:
  db:
    image: postgres:15-alpine
    container_name: ebyzomdental-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ebyzomdental_clinic}
      POSTGRES_USER: ${POSTGRES_USER:-ebyzomdental}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ebyzomdental_pgdata:/var/lib/postgresql/data
    networks:
      - cae_default
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ebyzomdental -d ebyzomdental_clinic"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    image: 104573823944.dkr.ecr.us-east-1.amazonaws.com/ebyzomdental-backend:latest
    container_name: ebyzomdental-backend
    restart: unless-stopped
    environment:
      # Use container_name, not service name — cae_default already has
      # other services named ``db`` (cae/sazon) and DNS would collide.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ebyzomdental}:${POSTGRES_PASSWORD}@ebyzomdental-db:5432/${POSTGRES_DB:-ebyzomdental_clinic}
      SECRET_KEY: ${SECRET_KEY}
      BUDGET_PUBLIC_SECRET_KEY: ${BUDGET_PUBLIC_SECRET_KEY:-}
      ENVIRONMENT: production
      ALLOWED_ORIGINS: ${PUBLIC_URL:-https://dental.ebyzom.com}
      STORAGE_BACKEND: local
      STORAGE_LOCAL_PATH: /app/storage
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      SEED_ON_STARTUP: "0"
      SEED_LANG: es
    volumes:
      - ebyzomdental_storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
    networks:
      - cae_default
    mem_limit: 512m
    expose:
      - "8000"

  frontend:
    image: 104573823944.dkr.ecr.us-east-1.amazonaws.com/ebyzomdental-frontend:latest
    container_name: ebyzomdental-frontend
    restart: unless-stopped
    environment:
      NUXT_PUBLIC_API_BASE_URL: ${PUBLIC_URL:-https://dental.ebyzom.com}
      API_BASE_URL_SERVER: http://backend:8000
    depends_on:
      - backend
    networks:
      - cae_default
    mem_limit: 384m
    expose:
      - "3000"

networks:
  cae_default:
    external: true

volumes:
  ebyzomdental_pgdata:
  ebyzomdental_storage:
