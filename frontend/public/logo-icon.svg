<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 48 48" fill="none" role="img" aria-label="EBYZOM dental">
  <!-- Soft pastel rounded square backdrop (calm, not saturated) -->
  <rect x="0" y="0" width="48" height="48" rx="11" fill="#E0F2FE"/>
  <rect x="0" y="0" width="48" height="48" rx="11" stroke="#0EA5E9" stroke-opacity="0.18" stroke-width="1"/>

  <!-- Tooth silhouette: two soft cusps + two roots, rounded -->
  <path d="M24 10
           c -4.5 0 -7.5 2.2 -9 2.2
           c -2.3 0 -4.5 2.2 -4.5 6.7
           c 0 3.8 1.5 6 2.3 9
           c 0.8 3 0.8 6.7 3 8.3
           c 1.5 0.8 2.3 -2.2 3 -5.3
           c 0.8 -2.3 1.5 -3.7 2.3 -3.7
           c 0.7 0 1.4 1.4 2.3 3.7
           c 0.7 3.1 1.5 6.1 3 5.3
           c 2.2 -1.6 2.2 -5.3 3 -8.3
           c 0.7 -3 2.2 -5.2 2.2 -9
           c 0 -4.5 -2.2 -6.7 -4.5 -6.7
           c -1.5 0 -4.5 -2.2 -9 -2.2 Z"
        fill="#FFFFFF"
        stroke="#0EA5E9"
        stroke-width="1.8"
        stroke-linejoin="round"
        stroke-linecap="round"/>

  <!-- Pin dot: the "Pin" in EBYZOM dental. Saturated accent (small, allowed) -->
  <circle cx="24" cy="19.5" r="2.6" fill="#0EA5E9"/>
  <circle cx="24" cy="19.5" r="0.9" fill="#FFFFFF"/>
</svg>
